name: Fusion Platform CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore backend/FusionPlatform.Api/FusionPlatform.Api.csproj

      - name: Build backend
        run: dotnet build backend/FusionPlatform.Api/FusionPlatform.Api.csproj --no-restore --configuration Release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fusion-platform-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fusion-platform-frontend:develop

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/FusionPlatform.Api
          file: ./backend/FusionPlatform.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fusion-platform-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fusion-platform-api:develop