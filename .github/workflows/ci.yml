name: Fusion Platform CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore backend/FusionPlatform.Api/FusionPlatform.Api.csproj

      - name: Build backend
        run: dotnet build backend/FusionPlatform.Api/FusionPlatform.Api.csproj --no-restore --configuration Release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fusion-platform-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fusion-platform-frontend:develop

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/FusionPlatform.Api
          file: ./backend/FusionPlatform.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fusion-platform-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fusion-platform-api:develop

   deploy-preprod:
    needs: build-test-publish
    if: ${{ github.event_name == 'push' && needs.build-test-publish.result == 'success' }}
    runs-on: [self-hosted, Windows, X64]

    env:
      MINIKUBE_HOME: 'C:/Users/HP/.minikube'
      KUBECONFIG: 'C:/Users/HP/.kube/config'
      MINIKUBE_EXE: 'C:\Program Files\Kubernetes\Minikube\minikube.exe'
      KUBECTL_EXE: 'C:\Users\HP\AppData\Local\Programs\DockerDesktop\resources\bin\kubectl.exe'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify runner and Kubernetes
        shell: powershell
        run: |
          Write-Host "=== RUNNER ==="
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"

          Write-Host "=== MINIKUBE ==="
          & "$env:MINIKUBE_EXE" version

          Write-Host "=== KUBERNETES NODES ==="
          & "$env:KUBECTL_EXE" get nodes

          Write-Host "=== PRE-PROD PODS ==="
          & "$env:KUBECTL_EXE" -n fusion-preprod get pods

      - name: Apply Kubernetes manifests
        shell: powershell
        run: |
          Write-Host "=== APPLY KUBERNETES MANIFESTS ==="

          & "$env:KUBECTL_EXE" apply -f k8s/namespace.yaml
          & "$env:KUBECTL_EXE" apply -f k8s/api-deployment.yaml
          & "$env:KUBECTL_EXE" apply -f k8s/api-service.yaml
          & "$env:KUBECTL_EXE" apply -f k8s/frontend-deployment.yaml
          & "$env:KUBECTL_EXE" apply -f k8s/frontend-service.yaml
          & "$env:KUBECTL_EXE" apply -f k8s/ingress.yaml

      - name: Deploy exact commit images
        shell: powershell
        run: |
          Write-Host "=== DEPLOYING COMMIT ==="
          Write-Host "$env:GITHUB_SHA"

          & "$env:KUBECTL_EXE" -n fusion-preprod set image deployment/fusion-api `
            fusion-api=ghcr.io/${{ github.repository_owner }}/fusion-platform-api:$env:GITHUB_SHA

          & "$env:KUBECTL_EXE" -n fusion-preprod set image deployment/fusion-frontend `
            fusion-frontend=ghcr.io/${{ github.repository_owner }}/fusion-platform-frontend:$env:GITHUB_SHA

      - name: Wait for API rollout
        shell: powershell
        run: |
          & "$env:KUBECTL_EXE" -n fusion-preprod rollout status deployment/fusion-api --timeout=180s

      - name: Wait for frontend rollout
        shell: powershell
        run: |
          & "$env:KUBECTL_EXE" -n fusion-preprod rollout status deployment/fusion-frontend --timeout=180s

      - name: Verify Kubernetes deployment
        shell: powershell
        run: |
          Write-Host "=== PODS ==="
          & "$env:KUBECTL_EXE" -n fusion-preprod get pods -o wide

          Write-Host "=== SERVICES ==="
          & "$env:KUBECTL_EXE" -n fusion-preprod get services

          Write-Host "=== INGRESS ==="
          & "$env:KUBECTL_EXE" -n fusion-preprod get ingress

          Write-Host "=== DEPLOYMENTS ==="
          & "$env:KUBECTL_EXE" -n fusion-preprod get deployments

      - name: Start Ingress port-forward
        shell: powershell
        run: |
          $process = Start-Process `
            -FilePath "$env:KUBECTL_EXE" `
            -ArgumentList "-n","ingress-nginx","port-forward","service/ingress-nginx-controller","18082:80" `
            -PassThru `
            -WindowStyle Hidden

          Set-Content "$env:RUNNER_TEMP\ingress-pf.pid" $process.Id

          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            throw "Ingress port-forward failed to start."
          }

      - name: Smoke test PRE-PROD
        shell: powershell
        run: |
          Write-Host "=== API SMOKE TEST ==="

          $api = Invoke-WebRequest `
            -UseBasicParsing `
            -Uri "http://127.0.0.1:18082/api/system/status" `
            -TimeoutSec 20

          if ($api.StatusCode -ne 200) {
            throw "API smoke test failed with HTTP $($api.StatusCode)"
          }

          Write-Host $api.Content

          Write-Host "=== FRONTEND SMOKE TEST ==="

          $frontend = Invoke-WebRequest `
            -UseBasicParsing `
            -Uri "http://127.0.0.1:18082/" `
            -TimeoutSec 20

          if ($frontend.StatusCode -ne 200) {
            throw "Frontend smoke test failed with HTTP $($frontend.StatusCode)"
          }

          Write-Host "Frontend HTTP 200 OK"

      - name: Stop Ingress port-forward
        if: always()
        shell: powershell
        run: |
          $pidFile = "$env:RUNNER_TEMP\ingress-pf.pid"

          if (Test-Path $pidFile) {
            $processId = Get-Content $pidFile

            Stop-Process `
              -Id $processId `
              -Force `
              -ErrorAction SilentlyContinue

            Remove-Item $pidFile -Force -ErrorAction SilentlyContinue
          }