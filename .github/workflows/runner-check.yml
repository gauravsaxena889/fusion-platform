name: Self-Hosted Runner Check

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  runner-check:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check runner identity
        shell: powershell
        run: |
          Write-Host "=== RUNNER IDENTITY ==="
          Write-Host "User: $env:USERNAME"
          Write-Host "Computer: $env:COMPUTERNAME"

      - name: Check Docker
        shell: powershell
        run: |
          Write-Host "=== DOCKER ==="
          & "C:\Users\HP\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" --version

      - name: Check kubectl
        shell: powershell
        run: |
          Write-Host "=== KUBECTL ==="
          & "C:\Users\HP\AppData\Local\Programs\DockerDesktop\resources\bin\kubectl.exe" version --client

      - name: Check Minikube
        shell: powershell
        run: |
          Write-Host "=== MINIKUBE ==="
          & "C:\Program Files\Kubernetes\Minikube\minikube.exe" version

      - name: Check Fusion PRE-PROD
        shell: powershell
        run: |
          Write-Host "=== MINIKUBE PRE-PROD STATUS ==="
          & "C:\Program Files\Kubernetes\Minikube\minikube.exe" -p fusion-preprod status